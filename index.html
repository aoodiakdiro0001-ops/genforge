function toast(m){let d=document.getElementById('toast');d.textContent=m;d.style.display='block';clearTimeout(d._h);d._h=setTimeout(()=>d.style.display='none',2200);}
function copyOut(id){const x=document.getElementById(id).textContent;if(!x.trim())return;if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast(t('copied')));else toast(x);}
function copyTxt(x){if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast(t('copied')));else toast(x);}
function dl(name,suggest,content){if(!content||!content.trim())return;const b=new Blob([content],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=suggest||name;a.click();}
function buildChecks(){

document.getElementById('dkChecks').innerHTML=Object.keys(DK).map(k=>`<label class="chk"><input type="checkbox" data-dk="${k}"${['node','postgres','redis'].includes(k)?' checked':''}>${k}</label>`).join('');
}
function genGitignore(){
const sel=[...document.querySelectorAll('[data-gi]:checked')].map(e=>e.dataset.gi);
if(!sel.length){toast(t('needSel'));return;}
const seen={};let out='';
sel.forEach(k=>{out+=`### ${k} ###\n`;GI[k].forEach(l=>{if(!seen[l]){seen[l]=1;out+=l+'\n';}});out+='\n';});
document.getElementById('giOut').textContent=out;}
function genDocker(){
const sel=[...document.querySelectorAll('[data-dk]:checked')].map(e=>e.dataset.dk);
if(!sel.length){toast(t('needSel'));return;}
const name=(document.getElementById('dkName').value||'app').trim()||'app';
const rst=document.getElementById('dkRestart').checked,vol=document.getElementById('dkVol').checked;
let y=`# ${name} — generated by GenForge\nversion: '3.8'\nservices:\n`;
const vols={};
sel.forEach(k=>{const s=DK[k];y+=`  ${k}:\n    image: ${s.img}\n`;
const p=s.port.split(':');y+=`    ports:\n      - "${p[0]}:${p[1]}"\n`;
if(s.env)y+=`    environment:\n      - ${s.env}\n`;
if(vol&&s.vol){const v=s.vol.split(':');if(v[1].startsWith('/')||v[1].startsWith('.'))y+=`    volumes:\n      - ${s.vol}\n`;else{const vn=v[0];vols[vn]=1;y+=`    volumes:\n      - ${s.vol}\n`;}}
if(rst)y+=`    restart: always\n`;});
const vn=Object.keys(vols);if(vn.length){y+='volumes:\n';vn.forEach(v=>{y+=`  ${v}:\n`;});}
document.getElementById('dkOut').textContent=y;}
let srvK='nginx';
function srvTab(k){srvK=k;}
function genServer(){
const dom=(document.getElementById('svDom').value||'example.com').trim()||'example.com';
const port=parseInt(document.getElementById('svPort').value)||3000;
const root=(document.getElementById('svRoot').value||'/var/www/html').trim()||'/var/www/html';
let s='';
if(srvK==='nginx')s=`# nginx — GenForge\nserver {\n  listen 80;\n  server_name ${dom} www.${dom};\n  location / {\n    proxy_pass http://127.0.0.1:${port};\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n  }\n}\n# sudo certbot --nginx -d ${dom} -d www.${dom}  # free SSL`;
else if(srvK==='apache')s=`# Apache — GenForge\n<VirtualHost *:80>\n  ServerName ${dom}\n  ServerAlias www.${dom}\n  DocumentRoot ${root}\n  ProxyPreserveHost On\n  ProxyPass / http://127.0.0.1:${port}/\n  ProxyPassReverse / http://127.0.0.1:${port}/\n</VirtualHost>\n# a2enmod proxy proxy_http ssl && certbot --apache -d ${dom}`;
else s=`# Caddy — GenForge (auto HTTPS!)\n${dom} {\n  reverse_proxy 127.0.0.1:${port}\n}\nwww.${dom} {\n  reverse_proxy 127.0.0.1:${port}\n}`;
document.getElementById('svOut').textContent=s;}
function rnd(n,cs){const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(let i=0;i<n;i++)s+=cs[a[i]%cs.length];return s;}
function genPw(){
let cs='';if(document.getElementById('cU').checked)cs+='ABCDEFGHJKLMNPQRSTUVWXYZ';if(document.getElementById('cL').checked)cs+='abcdefghijkmnopqrstuvwxyz';if(document.getElementById('cD').checked)cs+='23456789';if(document.getElementById('cS').checked)cs+='!@#$%^&*-_+=';
if(!cs){toast(t('needSel'));return;}
const n=Math.max(8,Math.min(128,parseInt(document.getElementById('pwLen').value)||32));
document.getElementById('pwOut').textContent=rnd(n,cs)+'\n# JWT secret (64 hex):\n'+rnd(64,'0123456789abcdef');}
async function shaHex(s,alg){const b=await crypto.subtle.digest('SHA-'+alg,new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function genHt(){const u=document.getElementById('htU').value.trim(),p=document.getElementById('htP').value;if(!u||!p){toast(t('needSel'));return;}
const h=await shaHex(p,1);const b=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(p)))));
document.getElementById('secOut2').textContent=u+':{SHA}'+b;}
function b64e(){try{document.getElementById('secOut2').textContent=btoa(unescape(encodeURIComponent(document.getElementById('b64In').value)));}catch(e){toast(t('badJSON'));}}
function b64d(){try{document.getElementById('secOut2').textContent=decodeURIComponent(escape(atob(document.getElementById('b64In').value.trim())));}catch(e){toast(t('badJSON'));}}
async function shaX(n){document.getElementById('secOut2').textContent=await shaHex(document.getElementById('b64In').value,n);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function jParse(){const v=JSON.parse(document.getElementById('jsonIn').value);return v;}
function tsOf(name,v,defs,opt){
if(v===null)return 'any';if(Array.isArray(v)){if(!v.length)return 'any[]';const ts=v.map(x=>tsOf(name,x,defs,true));const u=[...new Set(ts)];return (u.length>1?'('+u.join(' | ')+')':u[0])+'[]';}
if(typeof v==='object'){const iname=cap(name);if(!defs[iname]){defs[iname]=true;let s=`interface ${iname} {\n`;for(const k in v){s+=`  ${k}${opt?'?':''}: ${tsOf(k,v[k],defs,false)};\n`;}s+='}';defs[iname]=s;}return iname;}
return typeof v==='string'?'string':typeof v==='number'?(Number.isInteger(v)?'number':'number'):typeof v==='boolean'?'boolean':'any';}
function goOf(name,v,defs){
if(v===null)return 'interface{}';if(Array.isArray(v)){if(!v.length)return '[]interface{}';return '[]'+goOf(name,v[0],defs);}
if(typeof v==='object'){const iname=cap(name);if(!defs[iname]){defs[iname]=true;let s=`type ${iname} struct {\n`;for(const k in v){s+=`  ${cap(k)} ${goOf(k,v[k],defs)} \`json:"${k}"\`;\n`;}s+='}';defs[iname]=s;}return iname;}
return typeof v==='string'?'string':typeof v==='number'?(Number.isInteger(v)?'int':'float64'):typeof v==='boolean'?'bool':'interface{}';}
function pyOf(name,v,defs){
if(v===null)return 'Any';if(Array.isArray(v)){if(!v.length)return 'List[Any]';return 'List['+pyOf(name,v[0],defs)+']';}
if(typeof v==='object'){const iname=cap(name);if(!defs[iname]){defs[iname]=true;let s=`@dataclass\nclass ${iname}:\n`;const ks=Object.keys(v);if(!ks.length)s+='  pass';ks.forEach(k=>{s+=`  ${k}: ${pyOf(k,v[k],defs)}\n`;});defs[iname]=s;}return iname;}
return typeof v==='string'?'str':typeof v==='number'?(Number.isInteger(v)?'int':'float'):typeof v==='boolean'?'bool':'Any';}
function jTool(kind){
let v;try{v=jParse();}catch(e){toast(t('badJSON'));return;}
const out=document.getElementById('jsonOut');
try{
if(kind==='pretty')out.textContent=JSON.stringify(v,null,2);
else if(kind==='min')out.textContent=JSON.stringify(v);
else if(kind==='ts'){const d={};tsOf('root',v,d,false);out.textContent=Object.values(d).join('\n\n');}
else if(kind==='go'){const d={};goOf('root',v,d);out.textContent='type Root '+Object.values(d)[0].slice(4)+'\n\n'+Object.values(d).slice(1).join('\n\n');}
else if(kind==='py'){const d={};pyOf('root',v,d);out.textContent='from dataclasses import dataclass\nfrom typing import List, Any, Optional\n\n'+Object.values(d).join('\n\n');}
}catch(e){toast(t('badJSON'));}
}
function ip2n(ip){const o=ip.split('.');if(o.length!==4)return null;let n=0;for(const x of o){if(!/^\d+$/.test(x)||+x>255)return null;n=(n<<8)+ +x;}return n>>>0;}
function n2ip(n){return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');}
function n2bin(n){return n.toString(2).padStart(32,'0').replace(/(.{8})/g,'$1 ').trim();}
function calcSubnet(){
const raw=(document.getElementById('netIn').value||'').trim();
const m=raw.match(/^(\d+\.\d+\.\d+\.\d+)\/(\d{1,2})$/);
if(!m){toast(t('badCIDR'));return;}
const ip=ip2n(m[1]),n=+m[2];
if(ip==null||n>32){toast(t('badCIDR'));return;}
const mask=n===0?0:(0xFFFFFFFF<<(32-n))>>>0;
const net=(ip&mask)>>>0,brd=(net|(~mask>>>0))>>>0,wild=(~mask)>>>0;
const total=n>=31?(n===32?1:2):Math.pow(2,32-n)-2;
const first=n>=31?n2ip(net):n2ip(net+1),last=n>=31?n2ip(brd):n2ip(brd-1);
const cls=(net>>>24)<128?'A':(net>>>24)<192?'B':(net>>>24)<224?'C':(net>>>24)<240?'D':'E';
const row=(k,v)=>`<tr><td>${t(k)}</td><td class="mono">${v}</td></tr>`;
document.getElementById('netOut').innerHTML=`<table class="net">${row('kNet',n2ip(net)+'/'+n+' <small style="color:var(--mut)">'+n2bin(net)+'</small>')}${row('kBrd',n2ip(brd))}${row('kMask',n2ip(mask)+' <small style="color:var(--mut)">'+n2bin(mask)+'</small>')}${row('kWild',n2ip(wild))}${row('kFirst',first)}${row('kLast',last)}${row('kHosts',total.toLocaleString('en-US'))}${row('kRange',first+' — '+last)}${row('kClass',cls)}</table>`;
}
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function decJwt(){
const raw=(document.getElementById('jwtIn').value||'').trim();
const p=raw.split('.');
if(p.length<2){toast(t('badJWT'));return;}
try{
const h=JSON.parse(b64u(p[0])),pl=JSON.parse(b64u(p[1]));
let w='';
if(h.alg==='none')w=`<div class="note">${t('algW')}</div>`;
if(p.length<3||!p[2])w+=`<div class="note">${t('sigMiss')}</div>`;
document.getElementById('jwtOut').innerHTML=w+`<b>${t('hd')}</b><pre class="out">${JSON.stringify(h,null,2)}</pre><b>${t('pl')}</b><pre class="out">${JSON.stringify(pl,null,2)}</pre>`;
}catch(e){toast(t('badJWT'));}
}
